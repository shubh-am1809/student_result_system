{% extends "base.html" %}

{% block title %}Page Not Found - ResultSys{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card shadow">
            <div class="card-body py-5">
                <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                <h1 class="display-4">404</h1>
                <h3 class="mb-4">Page Not Found</h3>
                <p class="lead text-muted mb-4">
                    The page you are looking for might have been removed, had its name changed, 
                    or is temporarily unavailable.
                </p>
                <div class="row mt-5">
                    <div class="col-md-4 mb-3">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-primary w-100">
                            <i class="fas fa-home"></i> Go to Dashboard
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="{{ url_for('search_results') }}" class="btn btn-success w-100">
                            <i class="fas fa-search"></i> Search Results
                        </a>
                    </div>
                    <div class="col-md-4 mb-3">
                        <a href="javascript:history.back()" class="btn btn-secondary w-100">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
